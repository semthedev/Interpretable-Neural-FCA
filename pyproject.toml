[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-fca"
version = "0.1.0"
description = "Interpretable neural networks built from formal concept lattices"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "torch", "fcapy", "sparselinear"]

[project.optional-dependencies]
notebook = ["xgboost", "jupyter"]

[tool.setuptools]
packages = ["neural_fca"]
